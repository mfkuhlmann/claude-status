name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: python -m unittest discover -s tests -v

  # The status script also runs on SSH hosts, whose python3 can be as old as 3.7
  python37:
    name: Python 3.7 (SSH hosts)
    runs-on: ubuntu-latest
    container: python:3.7-slim
    steps:
      - uses: actions/checkout@v5
      - name: Run the tests
        run: python3 -m unittest discover -s tests -v
      - name: The status script on a host with no Claude
        run: python3 -I package/contents/code/talpy_den.py --remote --done-hours 24 --recent 5 | tail -1 | python3 -c "import json,sys; d=json.loads(sys.stdin.read().split('@@talpy-den@@',1)[1]); assert d['ok'], d"

  # The GNOME Shell extension: its logic (plain gjs, no shell needed) and
  # that it builds (schema compiles, zip packs)
  gnome:
    name: GNOME extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gjs
        run: sudo apt-get update && sudo apt-get install -y gjs libglib2.0-bin
      - name: Logic tests
        run: gjs -m gnome/tests/test_logic.js
      - name: Build the extension
        run: |
          gnome/build.sh
          python3 -m zipfile -l gnome/build/talpy-den@wzaielamri.github.io.shell-extension.zip | grep -E 'metadata.json|schemas/gschemas.compiled|code/talpy_den.py'

  # The VS Code extension (vscode/): type check, tests, and that it packs
  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Nothing private in the package
        run: |
          mkdir vsix
          unzip -q ./*.vsix -d vsix
          python3 ../tools/check_public.py vsix

  public:
    name: Nothing private in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 tools/check_public.py --all --history
